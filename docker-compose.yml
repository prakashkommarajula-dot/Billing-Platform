services:
  # -------------------------------------------------------------
  # 1. MongoDB Database Service
  # -------------------------------------------------------------
  mongodb:
    image: mongo:6-jammy
    container_name: billflow-mongodb
    restart: unless-stopped
    ports:
      - "27018:27017"
    environment:
      - MONGO_INITDB_DATABASE=invoice_billing_platform
    volumes:
      - mongodb_data:/data/db
    networks:
      - billflow-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # -------------------------------------------------------------
  # 2. Backend REST API Service
  # -------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: billflow-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/invoice_billing_platform
      - MONGO_URI=mongodb://mongodb:27017/invoice_billing_platform
      - JWT_SECRET=super_secret_jwt_key_invoice_billing_prod_2026_xyz123
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - billflow-network

  # -------------------------------------------------------------
  # 3. Frontend Web Service (Nginx SPA + Reverse Proxy)
  # -------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: billflow-frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "5173:80"
      - "3000:80"
    depends_on:
      - backend
    networks:
      - billflow-network

# ---------------------------------------------------------------
# Persistent Storage Volumes & Networks
# ---------------------------------------------------------------
volumes:
  mongodb_data:
    name: billflow_mongodb_data

networks:
  billflow-network:
    name: billflow-network
    driver: bridge
