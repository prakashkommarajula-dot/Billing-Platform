apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: billflow-ingress
  namespace: billflow
  labels:
    app.kubernetes.io/name: billflow
    app.kubernetes.io/component: ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 5000
