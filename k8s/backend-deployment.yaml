apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: billflow
  labels:
    app.kubernetes.io/name: billflow
    app.kubernetes.io/component: backend
    app: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
        app.kubernetes.io/name: billflow
        app.kubernetes.io/component: backend
    spec:
      containers:
        - name: backend
          image: invoicegenarator-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
              name: http-api
          envFrom:
            - configMapRef:
                name: billflow-config
            - secretRef:
                name: billflow-secret
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
