apiVersion: v1
kind: Service
metadata:
  name: mongodb
  namespace: billflow
  labels:
    app.kubernetes.io/name: billflow
    app.kubernetes.io/component: database
    app: mongodb
spec:
  type: ClusterIP
  selector:
    app: mongodb
  ports:
    - name: mongodb
      port: 27017
      targetPort: 27017
      protocol: TCP
