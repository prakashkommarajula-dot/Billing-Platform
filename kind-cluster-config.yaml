kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: billflow-cluster
nodes:
- role: control-plane
  extraPortMappings:
  - containerPort: 30080
    hostPort: 30080
    listenAddress: "0.0.0.0"
    protocol: TCP
  - containerPort: 30500
    hostPort: 30500
    listenAddress: "0.0.0.0"
    protocol: TCP
